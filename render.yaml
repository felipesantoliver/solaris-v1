# render.yaml
services:
  # Serviço Node.js (backend principal)
  - type: web
    name: solaris-node
    env: node
    rootDir: backend-node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_FLASH_API_KEY
        sync: false
      - key: GEMINI_PRO_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SANDBOX_URL
        sync: false
      - key: INTERNAL_TOKEN
        sync: false

  # Serviço Python (microsserviço FastAPI)
  - type: web
    name: solaris-python
    env: python
    rootDir: backend-python
    runtime: python3
    pythonVersion: "3.12.0"
    buildCommand: |
      pip install --upgrade pip "setuptools>=68.0.0,<81" wheel
      pip install -r requirements.txt
      python -m spacy download pt_core_news_sm
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2

  # Serviço de sandbox Python (execução isolada de código — ferramenta
  # python_sandbox do Modo Agente). Já estava documentado no README ("Passo 2
  # — Sandbox") mas nunca tinha sido registrado aqui, então nunca era
  # implantado de fato. Precisa subir ANTES do solaris-node (mesma ordem do
  # README) — copie a URL pública dele para SANDBOX_URL acima.
  - type: web
    name: solaris-sandbox
    env: docker
    rootDir: sandbox
    dockerfilePath: ./Dockerfile
    envVars:
      - key: INTERNAL_TOKEN
        sync: false
      - key: PORT
        value: 8000