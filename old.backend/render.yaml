services:
  - type: web
    name: solaris-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_FLASH_API_KEY
        sync: false
      - key: GEMINI_PRO_API_KEY
        sync: false